name: Benchmark

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      base:
        description: 'Base ref to compare against (SHA or tag)'
        required: true
      head:
        description: 'Head ref to benchmark (SHA or tag)'
        required: true

# Serialize benchmark runs: every run pushes to master, so concurrent runs
# must not race each other's git pull --rebase and push. The default
# cancel-in-progress: false queues the new run instead of cancelling the one
# in progress.
concurrency:
  group: benchmark

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout code
        # During a release event, GitHub Actions check out the release tag,
        # which leads to a "detached HEAD" state. To commit and push the
        # benchmark report back to the repository, we must explicitly check
        # out the persistent target branch.
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Install benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Resolve comparison refs
        id: refs
        env:
          HEAD_INPUT: ${{ inputs.head }}
          BASE_INPUT: ${{ inputs.base }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # On a release, compare the new tag against the nearest previous
            # release tag reachable from its parent commit.
            HEAD_REF="${{ github.ref_name }}"
            BASE_REF="$(git describe --tags --match 'v*' --abbrev=0 "${HEAD_REF}^")"
          else
            HEAD_REF="$HEAD_INPUT"
            BASE_REF="$BASE_INPUT"
          fi
          echo "base=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Fail when no previous release
        if: steps.refs.outputs.base == ''
        run: |
          echo "Base ref is empty: on a release there is no previous release tag; on dispatch, the base input is blank."
          exit 1

      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.refs.outputs.base }}
          path: base
          fetch-depth: 1

      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.refs.outputs.head }}
          path: head
          fetch-depth: 1

      - name: Set up Go
        # The cache is keyed on both comparison trees' go.sum files, which
        # only exist after the base and head checkouts; both trees share the
        # module and build cache.
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            base/go.sum
            head/go.sum

      - name: Run benchmarks on base
        run: |
          cd base
          # -count=5 runs each benchmark five times; benchstat aggregates the
          # samples with statistical confidence so single-run noise cannot be
          # misread as a change.
          go test -bench=. -run=^$ -benchmem -count=5 ./... > ../base.txt
          if [ ! -s ../base.txt ]; then
            echo "No benchmark results generated for base."
            exit 1
          fi

      - name: Run benchmarks on head
        run: |
          cd head
          go test -bench=. -run=^$ -benchmem -count=5 ./... > ../head.txt
          if [ ! -s ../head.txt ]; then
            echo "No benchmark results generated for head."
            exit 1
          fi

      - name: Generate benchmark comparison report
        env:
          BASE_REF: ${{ steps.refs.outputs.base }}
          HEAD_REF: ${{ steps.refs.outputs.head }}
        run: |
          # benchstat compares overlapping benchmark names only; benchmarks
          # present in one run but not the other (added, removed, or renamed)
          # are listed without a delta.
          benchstat base.txt head.txt > benchstat.txt
          {
            echo "# Benchmark comparison: ${BASE_REF} vs ${HEAD_REF}"
            echo ""
            echo "- Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "- Base: ${BASE_REF}"
            echo "- Head: ${HEAD_REF}"
            echo "- Go: $(go version)"
            echo "- CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            echo ""
            echo '```'
            cat benchstat.txt
            echo '```'
          } > benchmark-report.md
          cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit benchmark report
        if: github.event_name == 'release'
        env:
          BASE_REF: ${{ steps.refs.outputs.base }}
          HEAD_REF: ${{ steps.refs.outputs.head }}
        # base/ and head/ are nested git repositories inside this checkout;
        # only ever add .github/benchmarks here, never git add -A.
        run: |
          mkdir -p .github/benchmarks
          cp benchmark-report.md ".github/benchmarks/compare-${BASE_REF//\//-}-${HEAD_REF//\//-}.md"

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .github/benchmarks
          if git diff --quiet --staged -- .github/benchmarks; then
            echo "No changes to benchmark reports"
          else
            git commit -m "chore(benchmark): Compare ${BASE_REF} vs ${HEAD_REF}"
            git pull --rebase
            git push
          fi
